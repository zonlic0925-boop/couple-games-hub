<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- 背景流体金属渐变 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#0B0F19" />
    </linearGradient>

    <!-- 蓝紫霓虹渐变（左/蓝方） -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <!-- 樱花粉霓虹渐变（右/粉方） -->
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB7185" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>

    <!-- 金色高光渐变 -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- 外边框环绕光 -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#F43F5E" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.6" />
    </linearGradient>

    <!-- 顶部玻璃反光渐变 -->
    <linearGradient id="glossGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <!-- 梦幻内发光投影滤镜 -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 图标主体圆角背景 (iOS Squircle 规范半径) -->
  <rect x="0" y="0" width="512" height="512" rx="115" fill="url(#bgGrad)" />

  <!-- 外部质感高光边缘圈 -->
  <rect x="8" y="8" width="496" height="496" rx="108" fill="none" stroke="url(#rimGrad)" stroke-width="3" opacity="0.75" />

  <!-- 内部星芒氛围光晕背景 -->
  <circle cx="160" cy="180" r="140" fill="#6366F1" opacity="0.25" filter="url(#softGlow)" />
  <circle cx="352" cy="330" r="140" fill="#F43F5E" opacity="0.25" filter="url(#softGlow)" />

  <!-- 游戏手柄轮廓（以爱心融合游戏手柄造型呈现） -->
  <g transform="translate(0, 10)">
    <!-- 手柄背壳投影阴影 -->
    <path d="M 160 140 C 90 140 50 190 60 290 C 68 360 115 400 165 375 C 205 355 225 320 256 320 C 287 320 307 355 347 375 C 397 400 444 360 452 290 C 462 190 422 140 352 140 C 295 140 268 180 256 195 C 244 180 217 140 160 140 Z"
          fill="#111827" opacity="0.6" filter="url(#glow)" />

    <!-- 手柄主体外壳（超椭圆流线型） -->
    <path d="M 160 145 C 96 145 62 195 72 290 C 78 355 122 390 170 366 C 210 346 226 315 256 315 C 286 315 302 346 342 366 C 390 390 434 355 440 290 C 450 195 416 145 352 145 C 298 145 272 185 256 200 C 240 185 214 145 160 145 Z"
          fill="#1E293B" stroke="rgba(255, 255, 255, 0.15)" stroke-width="3" />

    <!-- 左翼蓝紫霓虹光带（代表蓝方 / Player 1） -->
    <path d="M 160 152 C 105 152 75 195 84 278 C 88 322 116 358 152 350 C 185 342 205 305 230 270 C 200 210 185 152 160 152 Z"
          fill="url(#blueGrad)" opacity="0.35" filter="url(#glow)" />

    <!-- 右翼粉红霓虹光带（代表粉方 / Player 2） -->
    <path d="M 352 152 C 407 152 437 195 428 278 C 424 322 396 358 360 350 C 327 342 307 305 282 270 C 312 210 327 152 352 152 Z"
          fill="url(#pinkGrad)" opacity="0.35" filter="url(#glow)" />

    <!-- 左手柄：经典十字键 (D-Pad) -->
    <g transform="translate(150, 245)">
      <rect x="-36" y="-12" width="72" height="24" rx="7" fill="#0F172A" stroke="#38BDF8" stroke-width="2.5" />
      <rect x="-12" y="-36" width="24" height="72" rx="7" fill="#0F172A" stroke="#38BDF8" stroke-width="2.5" />
      <circle cx="0" cy="0" r="6" fill="#38BDF8" opacity="0.8" />
    </g>

    <!-- 右手柄：四色璀璨水晶按键 (Action Buttons) -->
    <g transform="translate(362, 245)">
      <!-- 上键 (Y) -->
      <circle cx="0" cy="-24" r="11" fill="url(#goldGrad)" filter="url(#glow)" />
      <text x="0" y="-20" font-family="-apple-system, sans-serif" font-size="10" font-weight="900" fill="#78350F" text-anchor="middle">★</text>
      <!-- 下键 (A) -->
      <circle cx="0" cy="24" r="11" fill="url(#pinkGrad)" filter="url(#glow)" />
      <text x="0" y="28" font-family="-apple-system, sans-serif" font-size="11" font-weight="900" fill="#FFFFFF" text-anchor="middle">♥</text>
      <!-- 左键 (X) -->
      <circle cx="-24" cy="0" r="11" fill="url(#blueGrad)" filter="url(#glow)" />
      <!-- 右键 (B) -->
      <circle cx="24" cy="0" r="11" fill="#10B981" filter="url(#glow)" />
    </g>

    <!-- 中央核心：跳动的璀璨立体爱心（Happy & Love 灵魂） -->
    <g transform="translate(256, 218) scale(1.15)">
      <!-- 爱心光芒扩散层 -->
      <path d="M 0 -8 C -15 -35 -48 -30 -48 2 C -48 24 -15 48 0 64 C 15 48 48 24 48 2 C 48 -30 15 -35 0 -8 Z"
            fill="url(#pinkGrad)" opacity="0.5" filter="url(#softGlow)" />
      <!-- 爱心主体 -->
      <path d="M 0 -8 C -15 -35 -48 -30 -48 2 C -48 24 -15 48 0 64 C 15 48 48 24 48 2 C 48 -30 15 -35 0 -8 Z"
            fill="url(#pinkGrad)" stroke="#FFFFFF" stroke-width="2.5" />
      <!-- 爱心高光小亮点 -->
      <ellipse cx="-16" cy="-6" rx="8" ry="5" transform="rotate(-30, -16, -6)" fill="#FFFFFF" opacity="0.8" />
    </g>

    <!-- 中央双摇杆 (Thumbsticks) -->
    <circle cx="212" cy="285" r="18" fill="#1E293B" stroke="#6366F1" stroke-width="3" />
    <circle cx="212" cy="285" r="11" fill="#334155" />

    <circle cx="300" cy="285" r="18" fill="#1E293B" stroke="#F43F5E" stroke-width="3" />
    <circle cx="300" cy="285" r="11" fill="#334155" />

    <!-- 闪耀小星芒饰品 -->
    <polygon points="110,135 113,143 121,146 113,149 110,157 107,149 99,146 107,143" fill="#FDE047" opacity="0.9" filter="url(#glow)" />
    <polygon points="400,130 402,136 408,138 402,140 400,146 398,140 392,138 398,136" fill="#60A5FA" opacity="0.9" filter="url(#glow)" />
    <polygon points="256,120 258,126 264,128 258,130 256,136 254,130 248,128 254,126" fill="#F43F5E" opacity="0.8" filter="url(#glow)" />
  </g>

  <!-- 顶部半透明流线弧度玻璃反光（苹果拟物高光感） -->
  <path d="M 0 115 C 0 50 50 0 115 0 L 397 0 C 462 0 512 50 512 115 L 512 210 C 370 280 140 240 0 160 Z"
        fill="url(#glossGrad)" />

  <!-- 底部典雅文字（微浮雕：HAPPY GAMES） -->
  <text x="256" y="468" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif"
        font-size="29" font-weight="900" letter-spacing="4" fill="#F8FAFC" text-anchor="middle" opacity="0.95">
    HAPPY GAMES
  </text>
  <text x="256" y="467" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif"
        font-size="29" font-weight="900" letter-spacing="4" fill="url(#goldGrad)" text-anchor="middle" opacity="0.4">
    HAPPY GAMES
  </text>
</svg>